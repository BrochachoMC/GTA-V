<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA V</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; display: none; }
  img { width: 100%; height: 100%; object-fit: contain; display: none; }
  #buttons {
    position: absolute; inset: 0; margin: auto; width: 480px; height: 60px;
    display: flex; gap: 20px; justify-content: center;
  }
  button {
    width: 220px; height: 60px; font-size: 16px; border: 0; border-radius: 8px;
    background: #fff; color: #000; cursor: pointer; font-weight: bold;
  }
  button:hover { background: #ddd; }
  #error {
    display: none; width: 100%; height: 100%; position: absolute;
    flex-direction: column; justify-content: center; align-items: center;
    color: #fff; font-size: 48px; text-align: center;
  }
  #error-text { margin-top: 40px; font-size: 24px; }
  #credit { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #fff; font-size: 18px; }
</style>
</head>
<body>
<div id="buttons">
  <button id="start">Start Grand Theft Auto V</button>
  <button id="fullscreen">Full Screen</button>
</div>
<video id="loading" src="loading.mp4" playsinline></video>
<img id="menu" src="menu.png">
<video id="loading2" src="loading2.mp4" playsinline></video>
<video id="gameplay" src="gameplay.mp4" playsinline></video>
<video id="gameplay2" src="gameplay2.mp4" playsinline></video>
<div id="error">
  <div>:-(</div>
  <div id="error-text">Game is not ready yet</div>
  <div id="credit">Made by BrochachoMC</div>
</div>

<script>
  const btn = document.getElementById("start");
  const fsBtn = document.getElementById("fullscreen");
  const buttons = document.getElementById("buttons");
  const loading = document.getElementById("loading");
  const menu = document.getElementById("menu");
  const loading2 = document.getElementById("loading2");
  const gameplay = document.getElementById("gameplay");
  const gameplay2 = document.getElementById("gameplay2");
  const errorScreen = document.getElementById("error");
  let stage = 0;

  btn.onclick = async () => {
    buttons.style.display = "none";
    loading.style.display = "block";
    stage = 1;
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    try { await loading.play(); } catch (e) {}
  };

  fsBtn.onclick = async () => {
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
  };

  loading.onended = () => {
    loading.style.display = "none";
    menu.style.display = "block";
    stage = 2;
  };

  loading2.onended = () => {
    loading2.style.display = "none";
    gameplay.style.display = "block";
    stage = 4;
    setTimeout(() => {
      gameplay.play().catch(e => console.error("Erro ao tocar gameplay:", e));
    }, 100);
  };

  gameplay.onended = () => {
    gameplay.style.display = "none";
    gameplay2.style.display = "block";
    setTimeout(() => {
      gameplay2.play().catch(e => console.error("Erro ao tocar gameplay2:", e));
    }, 100);
  };

  gameplay2.onended = () => {
    gameplay2.style.display = "none";
    errorScreen.style.display = "flex";
  };

  document.addEventListener('keydown', (e) => {
    if (stage === 1) {
      e.preventDefault();
    }
    if (stage === 2 && e.key === 'Enter') {
      playClickAndLoadingVideo();
    } else if (stage === 2) {
      e.preventDefault();
    }
    if (e.key === 'Escape' && document.fullscreenElement) {
      document.exitFullscreen();
      buttons.style.display = "flex";
      loading.style.display = "none";
      menu.style.display = "none";
      loading2.style.display = "none";
      gameplay.style.display = "none";
      gameplay2.style.display = "none";
      errorScreen.style.display = "none";
      loading.currentTime = 0;
      loading2.currentTime = 0;
      gameplay.currentTime = 0;
      gameplay2.currentTime = 0;
      stage = 0;
    }
  });

  document.addEventListener('click', (e) => {
    if (stage === 2) {
      playClickAndLoadingVideo();
    } else if (stage === 1) {
      e.preventDefault();
    }
  });

  async function playClickAndLoadingVideo() {
    const click = new Audio('click.mp3');
    click.play();
    menu.style.display = "none";
    loading2.style.display = "block";
    stage = 3;
    setTimeout(() => {
      loading2.play().catch(e => console.error("Erro ao tocar loading2:", e));
    }, 100);
  }
</script>
</body>
</html>
